name: ETL Horaire - Qualité de l'air

on:
  # Déclenchement à la demande uniquement : bouton "Run workflow" dans
  # l'onglet Actions, ou appel API (ex. via un cron externe type
  # cron-job.org) toutes les heures. Plus de "schedule" GitHub natif,
  # dont le scheduler interne peut retarder ou sauter des runs.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Extraction (extract)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python -m scripts.extract.extract

      - name: Transformation (transform)
        run: python -m scripts.transform.transform

      - name: Sauvegarder le CSV dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/clean
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            git commit -m "chore: update aqi_clean.csv [skip ci]"
            git push
          fi

      - name: Chargement (load)
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: python -m scripts.load.load