name: Backfill manuel - Qualité de l'air

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Nombre de mois d'historique à récupérer"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Backfill (extract historique)
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BACKFILL_MONTHS: ${{ github.event.inputs.months }}
        run: python -m scripts.extract.backfill

      - name: Transformation (transform)
        run: python -m scripts.transform.transform

      - name: Sauvegarder le CSV dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/clean/aqi_clean.csv
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            git commit -m "chore: update aqi_clean.csv (backfill) [skip ci]"
            git push
          fi

      - name: Chargement (load)
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: python -m scripts.load.load
